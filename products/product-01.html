    <h1 class="products-index-title">
      黒い座面と背もたれ、木製の脚を持つモダンなデザインの椅子
    </h1>
    <div class="product-container">
      <img
        src="../assets/images/item1.webp"
        alt="黒い座面と背もたれ、木製の脚を持つモダンなデザインの椅子"
        class="product-image"
      />
      <div class="product-details">
        <p class="product-description">
          洗練されたモダンデザインのチェア。
          マットな黒の座面と背もたれが空間を引き締め、天然木の脚があたたかみをプラス。
        </p>
        <br />
        <p class="product-description">
          ダイニングやカウンター、ワークスペースなど幅広いシーンで活躍します。
          軽量ながらもしっかりとした安定感があり、長時間の使用でも快適な座り心地を提供します。
        </p>
        <br />
        <p class="product-price">¥18,000 +tax</p>
        <br />
        <div class="product-spec-list">
          <div class="product-spec-item">
            <span class="product-label">SIZE：</span>
            <span class="product-value">W45 × D50 × H85</span>
          </div>
          <div class="product-spec-item">
            <span class="product-label">COLOR：</span>
            <span class="product-value">ブラック</span>
          </div>
          <div class="product-spec-item">
            <span class="product-label">MATERIAL：</span>
            <span class="product-value">ポリプロピレン、天然木、スチール</span>
          </div>
        </div>
      </div>
    </div>
