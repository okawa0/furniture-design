<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product-04</title>
    <meta name="description" content="商品詳細ページです。" />
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="../assets/js/load-layout.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <h1 class="products-index-title">ミントグリーンの壁の前に立つ黒いフロアランプ</h1>
    <div class="product-container">
      <img
        src="../assets/images/item4.webp"
        alt="ミントグリーンの壁の前に立つ黒いフロアランプ"
        class="product-image"
      />
      <div class="product-details">
        <p class="product-description">
          シンプルながら存在感のある、ブラックのフロアランプ。
無駄のない直線的なデザインは、モダンやインダストリアル、北欧テイストなど幅広いインテリアにマッチします。
        </p>
        <br />
        <p class="product-description">
          シェード内側はホワイト仕上げで、光をやわらかく反射させ、読書や作業灯としても最適。
省スペース設計なのでリビングの一角やベッドサイドにも置きやすい一品です。
        </p>
        <br />
        <p class="product-price">¥22,000 +tax</p>
        <br />
        <div class="product-spec-list">
          <div class="product-spec-item">
            <span class="product-label">SIZE：</span>
            <span class="product-value">W28 × D28 × H160</span>
          </div>
          <div class="product-spec-item">
            <span class="product-label">COLOR：</span>
            <span class="product-value">ブラック</span>
          </div>
          <div class="product-spec-item">
            <span class="product-label">MATERIAL：</span>
            <span class="product-value">スチール、PVC</span>
          </div>
        </div>
      </div>
    </div>
    <a href="products.html" class="product-back-link">
      <p class="product-back">Back To Products</p>
    </a>
    <div id="footer"></div>
  </body>
</html>
