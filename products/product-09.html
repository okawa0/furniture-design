<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product-09</title>
    <meta name="description" content="商品詳細ページです。" />
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="../assets/js/load-layout.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <h1 class="products-index-title">カウンター席</h1>
    <div class="product-container">
      <img
        src="../assets/images/item9.webp"
        alt="木製座面と金属脚のバースツールが並ぶカウンター席"
        class="product-image"
      />
      <div class="product-details">
        <p class="product-description">
          シンプルでスタイリッシュなデザインのカウンターチェア。
スチールフレームと木製座面の組み合わせが、カフェやバーの空間に温かみとモダンさをプラスします。
        <br><br>
        <p class="product-description">
          背もたれ付きで適度なサポートがあり、長時間座っても快適。
家庭のキッチンカウンターや店舗什器としても活躍する万能アイテムです。

        </p>
        <br />
        <p class="product-price">¥25,000 +tax</p>
        <br />
        <div class="product-spec-list">
          <div class="product-spec-item">
            <span class="product-label">SIZE：</span>
            <span class="product-value">W40 × D45 × H75</span>
          </div>
          <div class="product-spec-item">
            <span class="product-label">COLOR：</span>
            <span class="product-value">ナチュラルウッド</span>
          </div>
          <div class="product-spec-item">
            <span class="product-label">MATERIAL：</span>
            <span class="product-value">天然木（ラバーウッド）、スチール（粉体塗装）</span>
          </div>
        </div>
      </div>
    </div>
    <a href="products.html" class="product-back-link">
      <p class="product-back">Back To Products</p>
    </a>
    <div id="footer"></div>
  </body>
</html>
